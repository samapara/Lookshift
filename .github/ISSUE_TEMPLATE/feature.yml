name: Feature request
description: An idea that would make Lookshift better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what gets in your way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This idea keeps everything on the Mac (no network, nothing stored from the camera).
          required: true

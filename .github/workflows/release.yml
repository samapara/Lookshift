name: Release

# Push a tag that matches VERSION, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
# Builds the .dmg and .zip and publishes them as a GitHub Release.
#
# Optional secrets for signed, notarized builds (without them the release is unsigned
# and people use System Settings → Privacy & Security → Open Anyway):
#   DEVELOPER_ID_P12           base64 of the "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  its password
#   DEVELOPER_ID               the identity name, e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD   Apple ID, team and app-specific password

on:
  push:
    tags: ["v*"]

# Nothing gets write access by default; only the release job does.
permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write      # publish the release
      id-token: write      # sign the build provenance
      attestations: write  # store the provenance on GitHub
    env:
      # Secrets can't be read in a step's `if`, so expose whether one is set.
      HAS_CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the build number is the commit count
          persist-credentials: false

      - name: Check the tag matches VERSION
        run: |
          [[ "${GITHUB_REF_NAME#v}" == "$(cat VERSION)" ]] || {
            echo "Tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)" >&2; exit 1; }

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        if: env.HAS_CERTIFICATE == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build, package and checksum
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: scripts/release.sh

      # Signed proof that these files were built by this workflow from this commit.
      # Anyone can check a download with: gh attestation verify <file> -R samapara/Lookshift
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Lookshift-*.dmg
            dist/Lookshift-*.zip

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          gh release create "$GITHUB_REF_NAME" \
            "dist/Lookshift-$VERSION.dmg" "dist/Lookshift-$VERSION.zip" dist/SHA256SUMS.txt \
            --title "Lookshift $VERSION" --generate-notes
